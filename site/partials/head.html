<script>
  (function () {
    var d = document.documentElement, t = 'night';
    try { var s = localStorage.getItem('theme'); if (s === 'day' || s === 'night') t = s; } catch (e) {}
    d.dataset.theme = t;
    d.classList.add('js');
    if (window.WebGLRenderingContext) d.classList.add('gl'); else d.classList.add('no-gl');
  })();
</script>
